<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Krama.ai Tirto</title><style>*{box-sizing:border-box;margin:0}body{font-family:system-ui;background:#FFFBF5;padding:14px}.b{max-width:560px;margin:auto}.c{background:#fff;border-radius:14px;padding:14px;margin-top:10px;box-shadow:0 2px 8px #0001}.btn{width:100%;background:#111;color:#fff;padding:12px;border-radius:10px;border:0;font-weight:800}.ip{width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:8px;font-size:13px}</style></head><body><div class=b><h1 style="text-align:center;font-weight:900;font-size:30px">Krama<span style="color:#f97316">.ai</span> <span style="font-size:9px;background:#111;color:#fff;padding:3px 6px;border-radius:8px">V3</span></h1><p id=s style="text-align:center;font-size:11px;color:#666;margin-top:4px">Memuat...</p><div class=c><textarea id=i rows=3 placeholder="Tulis Indonesia..." style="width:100%;border:0;outline:0;font-size:16px;resize:none"></textarea><button onclick=go() class=btn id=bt>TERJEMAH ✨</button><p style="font-size:10px;text-align:center;color:#aaa;margin-top:8px">DANA: 085292231180 | Rp 10K/bulan</p></div><div id=h style=display:none><div class=c><small>NGOKO</small><p id=n style=font-weight:700></p></div><div class=c style=border:1px solid #dbeafe><small style=color:#3b82f6>Madya</small><p id=m style=font-weight:700></p></div><div class=c style=background:#111;color:#fff><small style=color:#ffffff77>Inggil</small><p id=gg style=font-weight:700></p></div></div><div id=pw style=display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center;padding:16px"><div class=c style=max-width:340px;width:100%;text-align:center><h3>💎 Premium 10K</h3><p style=font-size:11px>DANA: <b>085292231180</b></p><input id=k placeholder="Kode TIRTO-BULAN-XXXX" class=ip style=margin-top:10px;text-align:center><button onclick=cek() class=btn style=margin-top:8px>AKTIFKAN</button><button onclick=document.getElementById('pw').style.display='none' style=margin-top:8px;width:100%;border:0;background:#eee;padding:8px;border-radius:8px>Nanti</button></div></div><div style=text-align:center;margin-top:28px><button onclick=openAdmin() style=background:#f3f4f6;border:1px dashed #d1d5db;padding:8px 14px;border-radius:20px;font-size:11px;color:#6b7280>🔧 Buka Admin Desa Tirto</button><p style=font-size:8px;color:#e5e7eb;margin-top:6px>buka?admin | pass baru</p></div><div id=admin style=display:none;position:fixed;inset:0;background:#FFFBF5;z-index:60;padding:14px;overflow:auto><div class=b><div class=c style=border:2px solid #fed7aa><h3>🔐 Admin Panel - Pass Baru</h3><p style=font-size:10px;color:gray>DANA 085292231180 | Pass: tirto0912026</p><div style=background:#dcfce7;padding:8px;border-radius:8px;margin-top:8px><p style=font-size:11px;font-weight:bold>💰 <span id=tc>0</span> kode | Rp <span id=tp>0</span></p></div><button onclick=gen() style=width:100%;margin-top:10px;background:#f97316;color:#fff;padding:10px;border:0;border-radius:8px;font-weight:800>+ Generate Kode</button><div id=lk style=margin-top:10px;max-height:180px;overflow:auto></div><hr style=margin:14px 0><h4 style=font-size:13px>📚 EDIT KAMUS DESA TIRTO</h4><div style=display:flex;gap:6px;margin-top:8px><input id=indo placeholder="Indonesia" class=ip style=flex:1><input id=jawa placeholder="Krama" class=ip style=flex:1></div><div style=display:flex;gap:6px;margin-top:6px><select id=tipe class=ip style=flex:1><option value=ngoko>Ngoko</option><option value=madya>Madya</option><option value=inggil>Inggil</option></select><button onclick=addKamus() style=flex:1;background:#111;color:#fff;border:0;border-radius:8px;font-weight:700>Tambah</button></div><div id=listKamus style=margin-top:10px;max-height:220px;overflow:auto></div><button onclick=closeAdmin() style=width:100%;margin-top:14px;background:#eee;border:0;padding:10px;border-radius:8px;font-weight:bold>Keluar & Simpan</button></div></div></div></div><script>
const PASS="tirto0912026";
let kamus=JSON.parse(localStorage.getItem('kamusTirto')||'{"makan":{"ngoko":"mangan","madya":"nedha","inggil":"dhahar"},"saya":{"ngoko":"aku","madya":"kula","inggil":"dalem"}}');
function getU(){const t=new Date().toDateString();const d=JSON.parse(localStorage.getItem('u')||'{"d":"","c":0}');return d.d!==t?{d:t,c:0}:d}
function isP(){const v=localStorage.getItem('p');return v&&new Date(v)>new Date()}
function upd(){const el=document.getElementById('s');if(isP()){const diff=Math.ceil((new Date(localStorage.getItem('p'))-new Date())/86400000);el.innerHTML='💎 PREMIUM '+diff+' hari';}else{const u=getU();el.innerText='Gratis: '+(5-u.c)+'x | DANA 085292231180';}}upd();
function openAdmin(){if(prompt('Password Admin (baru):')==PASS){document.getElementById('admin').style.display='block';render();renderKamus()}else alert('Salah! Password baru: tirto0912026')}
function closeAdmin(){document.getElementById('admin').style.display='none';history.replaceState({},'',location.pathname);localStorage.setItem('kamusTirto',JSON.stringify(kamus))}
function gen(){const k='TIRTO-BULAN-'+Math.random().toString(36).slice(2,3).toUpperCase()+Math.random().toString(36).slice(2,3).toUpperCase();let l=JSON.parse(localStorage.getItem('l')||'[]');l.unshift({k:k,d:new Date().toLocaleString()});localStorage.setItem('l',JSON.stringify(l));render();alert('KODE: '+k+'\nKirim ke warga yg TF 10K')}
function render(){const L=JSON.parse(localStorage.getItem('l')||'[]');document.getElementById('tc').innerText=L.length;document.getElementById('tp').innerText=(L.length*10000).toLocaleString('id-ID');let h='';L.forEach((x,i)=>{h+=`<div style=background:#f9fafb;padding:6px;border-radius:6px;margin-bottom:4px;font-size:11px;display:flex;justify-content:space-between><span><b>${x.k}</b><br><small>${x.d}</small></span><span onclick="let l=JSON.parse(localStorage.getItem('l')||'[]');l.splice(${i},1);localStorage.setItem('l',JSON.stringify(l));render()" style=color:red;cursor:pointer> x</span></div>`});document.getElementById('lk').innerHTML=h}
function addKamus(){const indo=document.getElementById('indo').value.trim().toLowerCase();const jawa=document.getElementById('jawa').value.trim();const tipe=document.getElementById('tipe').value;if(!indo||!jawa)return alert('Isi dulu!');if(!kamus[indo])kamus[indo]={ngoko:indo,madya:indo,inggil:indo};kamus[indo][tipe]=jawa;localStorage.setItem('kamusTirto',JSON.stringify(kamus));document.getElementById('indo').value='';document.getElementById('jawa').value='';renderKamus();}
function renderKamus(){let h='';Object.keys(kamus).forEach(k=>{const v=kamus[k];h+=`<div style=background:#fff;border:1px solid #eee;padding:6px 8px;border-radius:6px;margin-bottom:4px;font-size:11px;display:flex;justify-content:space-between><span><b>${k}</b>: ${v.ngoko}|${v.madya}|${v.inggil}</span><span onclick="delete kamus['${k}'];localStorage.setItem('kamusTirto',JSON.stringify(kamus));renderKamus()" style=color:red> hapus</span></div>`});document.getElementById('listKamus').innerHTML=h}
function cek(){let v=document.getElementById('k').value.trim().toUpperCase();if(!v.startsWith('TIRTO-'))return alert('Kode salah!');let u=new Date();u.setDate(u.getDate()+30);localStorage.setItem('p',u.toISOString());alert('AKTIF 30 HARI!');document.getElementById('pw').style.display='none';upd()}
function applyKamus(t){let out=t;Object.keys(kamus).forEach(k=>{const re=new RegExp('\\b'+k+'\\b','gi');out=out.replace(re,kamus[k].inggil)});return out}
async function go(){const inp=document.getElementById('i').value.trim();if(!inp)return alert('Ketik dulu!');const u=getU();if(!isP()&&u.c>=5){document.getElementById('pw').style.display='flex';return}const b=document.getElementById('bt');b.innerText='MENERJEMAH...';b.disabled=true;try{const r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(`Terjemahkan "${inp}" ke Jawa Ngoko Madya Inggil. JSON: {"ngoko":"...","madya":"...","inggil":"..."}`));const t=await r.text();const m=t.match(/\{[\s\S]*\}/);let d=JSON.parse(m[0]);d.inggil=applyKamus(d.inggil);document.getElementById('n').innerText=d.ngoko;document.getElementById('m').innerText=d.madya;document.getElementById('gg').innerText=d.inggil;document.getElementById('h').style.display='block';if(!isP()){u.c++;u.d=new Date().toDateString();localStorage.setItem('u',JSON.stringify(u));upd()}}catch(e){alert('Error!')}b.innerText='TERJEMAH ✨';b.disabled=false}
if(location.search.includes('admin')){setTimeout(()=>{if(prompt('Password Admin (baru):')==PASS){document.getElementById('admin').style.display='block';render();renderKamus()}},300)}
</script></body></html>
